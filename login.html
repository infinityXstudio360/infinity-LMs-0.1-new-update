<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfinityX - Login / Signup</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a222d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .auth-card {
            background-color: #273440;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 320px;
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: #4f46e5; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #444;
            border-radius: 6px;
            background: #1a222d;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background-color: #4338ca; }
        .toggle-link {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
            cursor: pointer;
        }
        .toggle-link span { color: #6366f1; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2 id="form-title">Login</h2>
        
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        
        <button id="auth-btn" onclick="handleAuth()">Login</button>
        
        <div class="toggle-link" onclick="toggleMode()">
            <span id="toggle-text">Don't have an account? Sign Up</span>
        </div>
    </div>

    <script>
        // නිවැරදි Firebase Configuration එක
        const firebaseConfig = {
            apiKey: "AIzaSyDSKSOOjlE7BSQFSyhDtLdMCsMivHf5R2g",
            authDomain: "infinityx-ef3c1.firebaseapp.com",
            projectId: "infinityx-ef3c1",
            storageBucket: "infinityx-ef3c1.firebasestorage.app",
            messagingSenderId: "268457109973",
            appId: "1:268457109973:web:84bd9dde3e8263cc12755c"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let isSignup = false;

        function toggleMode() {
            isSignup = !isSignup;
            document.getElementById('form-title').innerText = isSignup ? "Sign Up" : "Login";
            document.getElementById('auth-btn').innerText = isSignup ? "Sign Up" : "Login";
            document.getElementById('toggle-text').innerText = isSignup ? "Already have an account? Login" : "Don't have an account? Sign Up";
        }

        function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert("කරුණාකර Email සහ Password ඇතුළත් කරන්න!");
                return;
            }

            if (isSignup) {
                auth.createUserWithEmailAndPassword(email, password)
                    .then(() => {
                        alert("ගිණුම සාර්ථකව සාදන ලදී!");
                        window.location.href = "index.html";
                    })
                    .catch((error) => {
                        alert("දෝෂයක් සිදු විය: " + error.message);
                    });
            } else {
                auth.signInWithEmailAndPassword(email, password)
                    .then(() => {
                        alert("සාර්ථකව Login විය!");
                        window.location.href = "index.html";
                    })
                    .catch((error) => {
                        alert("පිවිසීමේ දෝෂයක්: " + error.message);
                    });
            }
        }
    </script>
    
</body>
</html>
